<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    li:first-of-type{
        color: rgb(3, 92, 95);
        font-size: 20px;
    }
    li:last-of-type{
        color: rgb(168, 92, 16);
        font-size: 20px;
    }
    li:nth-child(2){
        color: rgb(135, 37, 109);
        font-size: 20px;
    }
    
</style>
<body>
    <ol><li>HTML</li><li>CSS</li><li>JavaScript</li><li>React</li></ol>
    <a href="https://www.google.com" target="_blank">Google</a>
</body>
</html>
