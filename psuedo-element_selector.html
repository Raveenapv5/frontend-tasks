<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    h1::after{
        content: "V";
        color: red;
    }
    h1::before{
        content:"Hi";
        color: blue;
    }
    h1::after{
        content:",how are you?";
        color: rgb(133, 15, 91);
    }
    h1::first-letter{
        color: rgb(3, 92, 95);
        font-size: 50px;
    }
    div::first-line{
        color: rgb(151, 54, 9);
        font-size: 20px;
    }
    p::first-line{
        color: rgb(10, 161, 55);
        font-size: 20px;
    }
    p::selection{
        color: rgb(128, 11, 120);
        background-color: rgb(145, 154, 21);
    }
    li::marker{
        color: rgb(137, 17, 37);
        background-color: rgb(145, 154, 21);
    }
    </style>
</head>

</html>
