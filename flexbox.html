<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .container{
        display: flex;
        /* flex-direction: row;
        justify-content: space-around; */
        /* flex-wrap: wrap-reverse; */
        flex-wrap: wrap;
        gap: 20px;
    }
    .box{
        border: 1px solid black;
        background-color: rgb(138, 181, 181);
        border-radius: 5px;
        margin: 10px;
        color: #161316;
        font-size: 30px;
        text-align: center;
        width: 200px;
        height: 200px;
    }
   
</style>
<body>
    <div>
        <div class="container">
            <div class="box">Box 1</div>
            <div class="box">Box 2</div>
            <div class="box">Box 3</div>

        </div>
    </div>
</body>
</html>
