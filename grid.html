<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
           
            gap: 10px;
    
        }
        .box{
            border:2px solid black;
            background-color: rgb(209, 236, 236);
            padding: 20px;
            text-align: center;
            border-radius: 5px;
            
        }
    </style>
</head>
<body>
    <h1> pinterest</h1>
    <div class="container">
        <div class="box"><img src="w1.jpg" alt="Image 1" height="400px" width="100%"></div>
        <div class="box"><img src="w2.png" alt="Image 2" height="400px" width="100%"></div>
        <div class="box"><img src="w3.png" alt="Image 3" height="400px" width="100%"></div>
        <div class="box"><img src="w4.png" alt="Image 4" height="400px" width="100%"></div>
        <div class="box"><img src="w7.jpg" alt="Image 5" height="400px" width="100%"></div>
        <div class="box"><img src="w6.jpg" alt="Image 6" height="400px" width="100%"></div>
        </div>
</body>
</html>
