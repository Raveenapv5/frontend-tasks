<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    input:focus{
        background-color:rgb(199, 202, 25);
        color:rgb(30, 3, 3);
    }
    li:first-of-type{
        color: rgb(3, 92, 95);
        font-size: 20px;
    }
    li:last-of-type{
        color: rgb(168, 92, 16);
        font-size: 20px;
    }
    li:nth-child(2){
        color: rgb(135, 37, 109);
        font-size: 20px;
    }
    li:nth-child(3){
        color: rgb(177, 173, 94);
        font-size: 20px;
    }
    h1{
        color: rgb(15, 0, 1);
        font-size: 30px;
    }
    button:hover{
        background-color: rgb(3, 92, 95);
        color: white;
        cursor: pointer;
    }
    input:checked+label{
        
        color: rgb(154, 19, 148);
    
    }
    button:active{
        background-color: rgb(145, 138, 9);
        color: rgb(230, 228, 229);
    }
  *{
    background-color: rgb(212, 234, 235);
  }
    

</style>
<body>
    <h1>Student Registration Form</h1>
    <label for="name">Name:</label>
    <input type="text" id="name" name="name" placeholder="Enter your name"><br><br>
    <label for="email">Email:</label>
    <input type="email" id="email" name="email" placeholder="Enter your email"><br><br>
    <label for="password">Password:</label>
    <input type="password" id="password" name="password" placeholder="Enter your password"><br><br>
    <input type="checkbox" id="css" name="css" value="male">
    <label for="css">CSS</label><br>
   <ul><li>item1</li>
<li>item 2</li>
<li>item 3</li>
<li>item 4</li></ul>
<button>Submit</button> <button disabled>Registration</button>
</body>
</html>
